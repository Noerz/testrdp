```yaml
name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download ngrok
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:TEMP\ngrok.zip"

          Expand-Archive `
            -Path "$env:TEMP\ngrok.zip" `
            -DestinationPath "$env:TEMP\ngrok" `
            -Force

          & "$env:TEMP\ngrok\ngrok.exe" version

      - name: Authenticate ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          & "$env:TEMP\ngrok\ngrok.exe" config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Configure runneradmin
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret belum dibuat."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $SecurePassword

          Write-Host "RDP user: runneradmin"

      - name: Start ngrok TCP tunnel
        shell: powershell
        run: |
          Write-Host "Starting RDP tunnel..."
          Write-Host "Buka dashboard ngrok untuk melihat TCP address."
          & "$env:TEMP\ngrok\ngrok.exe" tcp 3389
```
