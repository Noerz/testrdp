name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # Catatan: Batas maksimal GitHub Actions adalah 360 menit (6 jam) untuk repo publik, atau 60 menit untuk repo privat (akun gratis).

    steps:
      - name: Download ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "ngrok" -Force

      - name: Authenticate ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "Secret NGROK_AUTH_TOKEN belum dibuat di repository settings"
          }
          .\ngrok\ngrok.exe config add-authtoken "$env:NGROK_AUTH_TOKEN"

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1

      - name: Set RDP password
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Secret RDP_PASSWORD belum dibuat di repository settings"
          }
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
          Write-Host "✅ Password untuk user 'runneradmin' berhasil diatur."

      - name: Start ngrok and display connection info
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # 1. Jalankan ngrok di background
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp", "3389" -NoNewWindow -PassThru
          
          # 2. Tunggu sebentar agar layanan ngrok siap
          Start-Sleep -Seconds 3
          
          # 3. Ambil URL publik dari API lokal ngrok dengan mekanisme retry
          $retries = 5
          $ngrokInfo = $null
          while ($retries -gt 0) {
              try {
                  $ngrokInfo = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                  break
              } catch {
                  Start-Sleep -Seconds 2
                  $retries--
              }
          }

          # 4. Tampilkan informasi koneksi dengan rapi
          if ($ngrokInfo -and $ngrokInfo.tunnels.Count -gt 0) {
              $tcpUrl = $ngrokInfo.tunnels[0].public_url
              Write-Host "========================================================"
              Write-Host "✅ RDP Siap Digunakan!"
              Write-Host "🌐 Server: $tcpUrl"
              Write-Host "👤 Username: runneradmin"
              Write-Host "🔑 Password: $env:RDP_PASSWORD"
              Write-Host "========================================================"
          } else {
              Write-Host "⚠️ Gagal mengambil URL ngrok. Periksa log error di atas."
          }
          
          # 5. Jaga agar workflow tetap berjalan (jangan hentikan manual)
          Write-Host "⏳ Menjaga workflow tetap berjalan agar sesi RDP tidak putus..."
          while ($true) {
              Start-Sleep -Seconds 60
          }
